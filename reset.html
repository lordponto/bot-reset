<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Reset System</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 60px; background: #f8f9fa; }
    h1 { color: #333; }
    input { padding: 12px; width: 280px; font-size: 16px; margin: 15px 0; border: 2px solid #999; border-radius: 6px; }
    button { padding: 14px 50px; font-size: 18px; background: #c62828; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #b71c1c; }
    #status { margin-top: 25px; font-size: 17px; min-height: 30px; }
  </style>
</head>
<body>
  <h1>Bot Reset System</h1>
  <p>Authorized Access Only</p>
  
  <input type="password" id="senha" placeholder="Enter password" autocomplete="off">
  <br><br>
  <button onclick="enviarReset()">SEND RESET</button>
  <div id="status"></div>

  <script>
    const ENDPOINT = 'https://allan-making-pathology-remote.trycloudflare.com/reset;
    const SECRET_TOKEN = 'k9Xv7mPq2wE9rT5yU8iO3l';   // Deve bater com o servidor

    async function enviarReset() {
      const password = document.getElementById('senha').value.trim();
      const statusEl = document.getElementById('status');

      if (!password) {
        statusEl.innerHTML = '<span style="color:red">Password is required</span>';
        return;
      }

      statusEl.innerHTML = 'Processing...';

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Reset-Token': SECRET_TOKEN
          },
          body: JSON.stringify({ password: password })
        });

        const data = await res.json();

        if (res.ok) {
          statusEl.innerHTML = `<span style="color:green">✅ ${data.message}</span>`;
        } else {
          statusEl.innerHTML = `<span style="color:red">❌ ${data.message}</span>`;
        }
      } catch (e) {
        statusEl.innerHTML = '<span style="color:red">❌ Connection failed. Server may be offline.</span>';
      }
    }
  </script>
</body>
</html>
